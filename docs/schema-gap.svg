<rect x="16" y="130" width="250" height="62" rx="3" fill="#FFFFFF" stroke="#CFCBC1"/><text x="30" y="150" font-size="10" fill="#656C75" font-family="JetBrains Mono, monospace">1001120250000078</text><text x="30" y="170" font-size="15" font-weight="500" fill="#14171C" font-family="JetBrains Mono, monospace">Suresha</text><text x="30" y="184" font-size="9.5" fill="#656C75" font-family="JetBrains Mono, monospace">PersonID A1</text><line x1="266" y1="161" x2="292" y2="161" stroke="#CFCBC1" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="296" cy="161" r="3.5" fill="#CFCBC1"/>
<rect x="16" y="216" width="250" height="62" rx="3" fill="#FFFFFF" stroke="#CFCBC1"/><text x="30" y="236" font-size="10" fill="#656C75" font-family="JetBrains Mono, monospace">1002220250000205</text><text x="30" y="256" font-size="15" font-weight="500" fill="#14171C" font-family="Noto Sans Kannada, sans-serif">ಸುರೇಶ</text><text x="30" y="270" font-size="9.5" fill="#656C75" font-family="JetBrains Mono, monospace">PersonID A1</text><line x1="266" y1="247" x2="292" y2="247" stroke="#CFCBC1" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="296" cy="247" r="3.5" fill="#CFCBC1"/>
<text x="16" y="292" font-size="11" fill="#8C2018" font-weight="500">No column joins these rows. Three people.</text>
<line x1="350" y1="30" x2="350" y2="272" stroke="#CFCBC1" stroke-width="1" stroke-dasharray="2 5"/>
<rect x="316" y="138" width="68" height="22" rx="11" fill="#F4F2EE" stroke="#CFCBC1"/>
